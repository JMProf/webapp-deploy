version: '3.8'

services:
  app:
    image: tu_usuario/todo_list__laravel_docker:latest
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db # Apuntamos al contenedor de abajo
      - DB_PORT=3306
      - DB_DATABASE=laravel_db
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=my-secure-password
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=laravel_db
      - MYSQL_USER=laravel_user
      - MYSQL_PASSWORD=my-secure-password
      - MYSQL_ROOT_PASSWORD=root-password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: