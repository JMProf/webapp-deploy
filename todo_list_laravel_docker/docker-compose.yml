services:
  app:
    image: tu_usuario/todo_list_laravel_docker:latest
    ports:
      - "8000:80"
    environment: # Variables necesarias para Laravel
      - DB_CONNECTION=mysql
      - DB_HOST=db # Apuntamos al contenedor de abajo
      - DB_PORT=3306
      - DB_DATABASE=todo_list_laravel_docker_db
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=My-secure-password1
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: todo_list_laravel_docker_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: My-secure-password1
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: